# 反编译 / 反混淆 Minecraft 很吃内存，默认 512M 会失败
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true

# 个别仓库（如已停服的 oss.sonatype.org）会长时间不响应，加超时避免永久挂起
systemProp.org.gradle.internal.http.connectionTimeout=30000
systemProp.org.gradle.internal.http.socketTimeout=60000
# Gradle 2.x 复用失效的 keep-alive 连接时会一直等下去，关掉连接复用
systemProp.http.keepAlive=false
systemProp.java.net.preferIPv4Stack=true
# 解析失败时自动重试几次
systemProp.org.gradle.internal.repository.max.tentatives=5
systemProp.org.gradle.internal.repository.initial.backoff=300
